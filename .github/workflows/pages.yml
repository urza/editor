name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs on purpose. The deploy step looks its upload up by name, and
  # GitHub's list of uploads can lag the upload by a moment. In one job the
  # lookup ran within a second of the upload, found nothing, and the deploy
  # failed (2026-11-19, three runs; actions/deploy-pages issue 451). A second
  # job starts some seconds later, which is the gap the lookup needs. Do not
  # merge the jobs back into one.
  #
  # After a failed run, start a new run ("Run workflow") and do not re-run the
  # failed one: a re-run uploads again into the same run, and the deploy step
  # refuses two uploads with one name.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site is already static; the only "build" is refreshing the service
      # worker precache list so every deploy busts the offline cache correctly.
      - name: Regenerate service worker precache manifest
        run: python3 app/tools/gen_sw.py

      # The site is the app plus two sibling pages: the crypto prototype and
      # the "How it works" guide in docs/. Both are deliberately outside app/,
      # so they never enter the service worker precache; sw.js also exempts
      # them from the app-shell fallback.
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r app/. _site/
          cp -r crypto-proto _site/crypto-proto
          cp -r docs _site/docs

      - uses: actions/configure-pages@v5
        with:
          # First run creates the Pages site; the workflow token has pages:write.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
