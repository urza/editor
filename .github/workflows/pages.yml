name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site is already static; the only "build" is refreshing the service
      # worker precache list so every deploy busts the offline cache correctly.
      - name: Regenerate service worker precache manifest
        run: python3 poc/tools/gen_sw.py

      - uses: actions/configure-pages@v5
        with:
          # First run creates the Pages site; the workflow token has pages:write.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: poc

      - id: deployment
        uses: actions/deploy-pages@v4
