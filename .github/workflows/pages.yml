name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site is already static; the only "build" is refreshing the service
      # worker precache list so every deploy busts the offline cache correctly.
      - name: Regenerate service worker precache manifest
        run: python3 app/tools/gen_sw.py

      # The site is the app plus the crypto prototype as a sibling page. The
      # prototype is deliberately outside app/, so it never enters the service
      # worker precache; sw.js also exempts it from the app-shell fallback.
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r app/. _site/
          cp -r crypto-proto _site/crypto-proto

      - uses: actions/configure-pages@v5
        with:
          # First run creates the Pages site; the workflow token has pages:write.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
