[package]
name = "vrtti"
version = "0.1.0"
description = "Desktop shell for the vrtti editor: a native window around the deployed PWA"
authors = ["urza"]
repository = "https://github.com/urza/editor"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vrtti_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# "devtools" keeps the web inspector in release builds. The spike
# (desktop-wrapper-tauri-vs-wails.md §8) reads the console to see which chords
# reach the page and by which path. Drop the feature once the spike is over.
tauri = { version = "2.11.6", features = ["devtools"] }
# Debug > Copy spike report puts the report on the clipboard. This is the
# first and so far only Tauri IPC the page origin may call (capabilities/).
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
# The three file pickers of the native disk backend (architecture.md §17).
# Used from Rust only: the page never gets a dialog permission, so a page
# script cannot open a picker the user did not ask for.
tauri-plugin-dialog = "2"
# std::fs errors name no path. fs-err wraps every call and puts the path in
# the message, which is what makes an `io` DiskError readable in a log
# (desktop-wrapper-goose-patterns.md §4).
fs-err = "3"
# Shell auto-update (architecture.md §18). Used from Rust only, like the
# dialog plugin: the page gets no updater permission in capabilities/.
tauri-plugin-updater = "2"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
# The config test in lib.rs reads the three platform files the way the CLI
# merges them (architecture.md §24); this sandbox cannot run a Windows or
# macOS build to find a typo there. Already in the tree through tauri.
tauri-utils = "2"

[profile.dev.package."*"]
# Dependencies without debug info: a smaller target/ and faster links
# (desktop-wrapper-goose-patterns.md §5). First-party code keeps its symbols.
debug = false
