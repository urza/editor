<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vrtti</title>
<meta name="theme-color" content="#2E3238">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">

<!-- Every bare specifier maps to one vendored file. One entry per package, no
     versions in the specifier: that is what keeps a single @codemirror/state
     instance alive and keeps `instanceof` checks working across packages. -->
<script type="importmap">
{
  "imports": {
    "@codemirror/state": "./vendor/@codemirror/state/index.js",
    "@codemirror/view": "./vendor/@codemirror/view/index.js",
    "@codemirror/language": "./vendor/@codemirror/language/index.js",
    "@codemirror/commands": "./vendor/@codemirror/commands/index.js",
    "@codemirror/search": "./vendor/@codemirror/search/index.js",
    "@codemirror/autocomplete": "./vendor/@codemirror/autocomplete/index.js",
    "@codemirror/lint": "./vendor/@codemirror/lint/index.js",
    "@codemirror/lang-markdown": "./vendor/@codemirror/lang-markdown/index.js",
    "@codemirror/lang-javascript": "./vendor/@codemirror/lang-javascript/index.js",
    "@codemirror/lang-html": "./vendor/@codemirror/lang-html/index.js",
    "@codemirror/lang-css": "./vendor/@codemirror/lang-css/index.js",
    "@lezer/common": "./vendor/@lezer/common/index.js",
    "@lezer/highlight": "./vendor/@lezer/highlight/index.js",
    "@lezer/lr": "./vendor/@lezer/lr/index.js",
    "@lezer/markdown": "./vendor/@lezer/markdown/index.js",
    "@lezer/javascript": "./vendor/@lezer/javascript/index.js",
    "@lezer/html": "./vendor/@lezer/html/index.js",
    "@lezer/css": "./vendor/@lezer/css/index.js",
    "@marijn/find-cluster-break": "./vendor/@marijn/find-cluster-break/index.js",
    "crelt": "./vendor/crelt/index.js",
    "harper.js": "./vendor/harper/index.js",
    "style-mod": "./vendor/style-mod/index.js",
    "w3c-keyname": "./vendor/w3c-keyname/index.js"
  }
}
</script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <!-- Three-part column: the primary action on top, one scroller in the
           middle, settings pinned at the bottom (architecture.md §9). The "+"
           stays outside the scroller on purpose, so neither the app's main
           action nor settings can scroll out of reach. -->
      <button id="new-buffer" type="button" title="New buffer (Alt+N)">+</button>
      <!-- Everything that can grow lives here. The scroll and the sidebar
           padding belong on this div, not on #sidebar, or the pinned buttons
           would scroll away with the lists. -->
      <div id="sidebar-scroll">
        <!-- Disk entry points. Hidden in the markup and unhidden by ui/sidebar.js
             only where the File System Access API exists: Firefox and phones must
             never see a button that cannot work. -->
        <div id="open-actions" hidden>
          <button id="open-file" type="button" title="Open a file from disk">file</button>
          <button id="open-folder" type="button" title="Open a folder from disk">folder</button>
        </div>
        <h2 class="sidebar-heading">Open</h2>
        <ul id="open-list" class="buffer-list"></ul>
        <!-- One section per opened folder, filled by ui/sidebar.js. Stays empty
             where the File System Access API is missing. -->
        <div id="folder-sections"></div>
        <h2 class="sidebar-heading" id="recent-heading" hidden></h2>
        <ul id="recent-list" class="buffer-list" hidden></ul>
      </div>
      <button id="sidebar-settings" type="button" title="Settings">⚙ settings</button>
    </aside>
    <div id="resizer"></div>
    <main id="editor-host">
      <!-- Overlay over the editor, filled by ui/settings.js from its item list.
           It sits inside #editor-host so it covers exactly the editor area and
           leaves the sidebar usable; the narrow media query in app.css switches
           it to fixed so a phone gets a full-screen panel. -->
      <div id="settings-panel" role="dialog" aria-label="Settings" tabindex="-1" hidden></div>
    </main>
  </div>
  <footer id="statusbar">
    <span id="status-title"></span>
    <span id="status-save">saved</span>
    <span id="status-build"></span>
    <!-- No title and no state class here: ui/statusbar.js owns both, because
         the spellcheck state comes from localStorage, not from the markup. -->
    <button id="status-spell" class="icon-button" type="button">abc</button>
    <!-- Save to disk. Hidden here and shown by ui/statusbar.js for scratch
         buffers only, and only where the File System Access API exists. -->
    <button id="status-saveas" class="icon-button" type="button" title="Save to disk…" hidden>⤓</button>
    <button id="status-update" class="icon-button" type="button" title="Check for update">↻</button>
  </footer>
  <script type="module" src="./js/main.js"></script>
  <script>
    // updateViaCache "none": update checks must bypass the HTTP cache for both
    // sw.js and its importScripts'd precache list, or deploys go unnoticed.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" });
    }
  </script>
</body>
</html>
