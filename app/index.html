<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vrtti</title>
<meta name="theme-color" content="#2E3238">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">

<!-- Replays the stored text sizes before the first paint. js/ui/textsize.js
     owns these two keys and is the only writer; this only reads them back. It
     has to be here, inline and in the head: a module script is deferred, so
     the app would paint once at the default size and then visibly jump.
     The bounds repeat that module's ranges as a guard, not as the rule: a
     value rejected here keeps the CSS default, and the module settles it a
     moment later. Without the guard a junk value reaches --ui-scale as NaN,
     which voids every calc() in the chrome for that first frame. -->
<script>
  try {
    const root = document.documentElement.style;
    const ui = Number(localStorage.getItem("vrtti.uiScale"));
    const editor = Number(localStorage.getItem("vrtti.editorFontSize"));
    if (ui >= 70 && ui <= 200) root.setProperty("--ui-scale", String(ui / 100));
    if (editor >= 9 && editor <= 32) root.setProperty("--editor-font-size", editor + "px");
  } catch (err) {
    // Private mode can throw on localStorage. The CSS defaults then stand.
  }
</script>

<!-- Every bare specifier maps to one vendored file. One entry per package, no
     versions in the specifier: that is what keeps a single @codemirror/state
     instance alive and keeps `instanceof` checks working across packages. -->
<script type="importmap">
{
  "imports": {
    "@codemirror/state": "./vendor/@codemirror/state/index.js",
    "@codemirror/view": "./vendor/@codemirror/view/index.js",
    "@codemirror/language": "./vendor/@codemirror/language/index.js",
    "@codemirror/commands": "./vendor/@codemirror/commands/index.js",
    "@codemirror/search": "./vendor/@codemirror/search/index.js",
    "@codemirror/autocomplete": "./vendor/@codemirror/autocomplete/index.js",
    "@codemirror/lint": "./vendor/@codemirror/lint/index.js",
    "@codemirror/lang-markdown": "./vendor/@codemirror/lang-markdown/index.js",
    "@codemirror/lang-javascript": "./vendor/@codemirror/lang-javascript/index.js",
    "@codemirror/lang-html": "./vendor/@codemirror/lang-html/index.js",
    "@codemirror/lang-css": "./vendor/@codemirror/lang-css/index.js",
    "@codemirror/lang-json": "./vendor/@codemirror/lang-json/index.js",
    "@codemirror/legacy-modes/mode/clike": "./vendor/@codemirror/legacy-modes/mode/clike.js",
    "@lezer/common": "./vendor/@lezer/common/index.js",
    "@lezer/highlight": "./vendor/@lezer/highlight/index.js",
    "@lezer/lr": "./vendor/@lezer/lr/index.js",
    "@lezer/markdown": "./vendor/@lezer/markdown/index.js",
    "@lezer/javascript": "./vendor/@lezer/javascript/index.js",
    "@lezer/html": "./vendor/@lezer/html/index.js",
    "@lezer/css": "./vendor/@lezer/css/index.js",
    "@lezer/json": "./vendor/@lezer/json/index.js",
    "@marijn/find-cluster-break": "./vendor/@marijn/find-cluster-break/index.js",
    "crelt": "./vendor/crelt/index.js",
    "harper.js": "./vendor/harper/index.js",
    "hunspell-wasm": "./vendor/hunspell/dist/Hunspell.js",
    "style-mod": "./vendor/style-mod/index.js",
    "w3c-keyname": "./vendor/w3c-keyname/index.js"
  }
}
</script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <!-- Four-part column: the primary action on top, one scroller in the
           middle, Recent and settings pinned at the bottom (architecture.md
           §9). The "+" stays outside the scroller on purpose, so neither the
           app's main action nor the pinned parts can scroll out of reach. -->
      <div id="sidebar-top">
        <!-- Collapses the sidebar. The twin of this button, #sidebar-open,
             takes over once the sidebar is gone (ui/shell.js). -->
        <button id="sidebar-toggle" type="button" title="Hide sidebar (Alt+B)"
                aria-controls="sidebar" aria-expanded="true">☰</button>
        <button id="new-buffer" type="button" title="New buffer (Alt+N)">+</button>
      </div>
      <!-- Everything that can grow lives here. The scroll and the sidebar
           padding belong on this div, not on #sidebar, or the pinned buttons
           would scroll away with the lists. -->
      <div id="sidebar-scroll">
        <!-- Search in files (architecture.md §16), filled by ui/search.js. First
             in the scroller, so the results replace the lists in place; the
             class `searching` on #sidebar hides everything below while it is
             open. Hidden here, because the sidebar opens on the lists. -->
        <section id="search-view" hidden aria-label="Search in files">
          <div class="search-head">
            <h2 class="sidebar-heading">Search</h2>
            <button id="search-close" type="button" title="Close search (Esc)">×</button>
          </div>
          <!-- A form, so Enter in the field and the Go button are one path
               (architecture.md §16: typing does not search, Enter does). -->
          <form id="search-form" class="search-form">
            <input id="search-query" type="text" placeholder="Find in files" autocomplete="off" spellcheck="false">
            <button id="search-case" type="button" title="Match case" aria-pressed="false">Aa</button>
            <button id="search-go" type="submit" title="Search (Enter)">Go</button>
          </form>
          <div id="search-status" class="search-status" aria-live="polite"></div>
          <ul id="search-results" class="search-results"></ul>
        </section>
        <!-- Disk entry points. The two disk buttons are hidden in the markup and
             unhidden by ui/sidebar.js only where the File System Access API
             exists: Firefox and phones must never see a button that cannot work.
             The row itself always shows; search works without the API. -->
        <div id="open-actions">
          <button id="search-open" type="button" title="Find in files (Ctrl+Shift+F)">search</button>
          <button id="open-file" type="button" title="Open a file from disk" hidden>file</button>
          <button id="open-folder" type="button" title="Open a folder from disk" hidden>folder</button>
          <button id="new-window" type="button" title="New window (Alt+Shift+N)">window</button>
        </div>
        <h2 class="sidebar-heading">Open</h2>
        <ul id="open-list" class="buffer-list"></ul>
        <!-- One section per opened folder, filled by ui/sidebar.js. Stays empty
             where the File System Access API is missing. -->
        <div id="folder-sections"></div>
      </div>
      <!-- Recent sits under the scroller, above settings, not at the end of
           the lists (user decision, 2026-09-24): one closed heading that is
           always in the same place. Hidden until a closed document exists;
           expanded, the list scrolls on its own inside the block (app.css).
           ui/sidebar.js owns both hidden attributes. -->
      <div id="recent" hidden>
        <h2 class="sidebar-heading" id="recent-heading"></h2>
        <ul id="recent-list" class="buffer-list" hidden></ul>
      </div>
      <button id="sidebar-settings" type="button" title="Settings">⚙ settings</button>
    </aside>
    <div id="resizer"></div>
    <!-- Dims the editor behind an open drawer, and closes it on a tap. Shown
         by app.css on narrow screens only; a docked sidebar needs no scrim. -->
    <div id="sidebar-scrim"></div>
    <main id="editor-host">
      <!-- The way back when the sidebar is collapsed. Floats over the top-left
           corner of the editor; app.css shows it only in that state. -->
      <button id="sidebar-open" type="button" title="Show sidebar (Alt+B)"
              aria-controls="sidebar" aria-expanded="false">☰</button>
      <!-- Overlay over the editor, filled by ui/settings.js from its item list.
           It sits inside #editor-host so it covers exactly the editor area and
           leaves the sidebar usable; the narrow media query in app.css switches
           it to fixed so a phone gets a full-screen panel. -->
      <div id="settings-panel" role="dialog" aria-label="Settings" tabindex="-1" hidden></div>
    </main>
  </div>
  <footer id="statusbar">
    <span id="status-title"></span>
    <span id="status-save">saved</span>
    <span id="status-build"></span>
    <!-- No title and no state class here: ui/statusbar.js owns both, because
         the spellcheck state comes from localStorage, not from the markup. -->
    <button id="status-spell" class="icon-button" type="button">abc</button>
    <!-- Sync state. Hidden here and shown by ui/statusbar.js only once a server
         is configured: with no sync there is nothing to report. -->
    <button id="status-sync" class="icon-button" type="button" hidden></button>
    <!-- Save to disk. Hidden here and shown by ui/statusbar.js for scratch
         buffers only, and only where the File System Access API exists. -->
    <button id="status-saveas" class="icon-button" type="button" title="Save to disk…" hidden>⤓</button>
    <button id="status-update" class="icon-button" type="button" title="Check for update">↻</button>
  </footer>
  <script type="module" src="./js/main.js"></script>
  <script>
    // updateViaCache "none": update checks must bypass the HTTP cache for both
    // sw.js and its importScripts'd precache list, or deploys go unnoticed.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" });
    }
  </script>
</body>
</html>
